<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星級怪獸卡工作室</title>
    <link rel="stylesheet" href="./style.css?v=20260726d" />
  </head>
  <body>
    <header>
      <div><span class="eyebrow">AI CARD LAB</span><h1>星級怪獸卡工作室</h1></div>
      <button id="teacher-open" class="ghost">教師控制台</button>
    </header>
    <main>
      <section id="join-view" class="panel join">
        <span class="badge">第一堂：創作自己的原創怪獸卡</span>
        <h2>輸入你的學生代碼</h2>
        <p>不用註冊帳戶。老師派發代碼後，每人可獨立創作。</p>
        <form id="join-form">
          <label>名字／暱稱<input id="display-name" maxlength="18" required placeholder="例如：小明" /></label>
          <label>學生代碼<input id="student-code" autocapitalize="characters" required placeholder="例如：STAR-01-A1B2" /></label>
          <button>開始創作</button>
        </form>
        <p id="join-message" class="message"></p>
      </section>

      <section id="studio-view" hidden>
        <div class="studio-head"><div><span id="hello" class="eyebrow"></span><h2>設計你的怪獸卡</h2></div><div id="quota" class="quota"></div><button id="switch-student" class="ghost">換學生</button></div>
        <div class="studio-grid">
          <section class="panel controls">
            <label>怪獸名稱<input id="card-name" maxlength="22" value="閃電雲狐" /></label>
            <label>屬性<select id="element"><option value="lightning">雷電 ⚡</option><option value="grass">草 🍃</option><option value="psychic">超能力 ✦</option><option value="water">水 💧</option></select></label>
            <label>能力<input id="ability" maxlength="28" value="星光衝刺" /></label>
            <label>畫面描述<textarea id="prompt" maxlength="300" rows="5" placeholder="例如：一隻橙色小狐狸，在夜空雲朵上跳躍，有閃電尾巴，兒童繪本風格"></textarea></label>
            <p class="hint">請創作原創角色；不要輸入真實姓名、住址或電話，也不要用官方角色名稱。</p>
            <button id="trial-generate" class="secondary">試畫草圖（消耗 1 次）</button>
            <button id="final-generate">製作完成圖（消耗 1 次）</button>
            <p id="studio-message" class="message"></p>
          </section>
          <section class="preview-wrap">
            <article id="card" class="card template-lightning">
              <span class="base-label">基礎</span>
              <div class="card-top"><strong id="preview-name">閃電雲狐</strong><span id="preview-hp">HP 100</span></div>
              <div id="art" class="art"><span>等待你的 AI 圖畫</span></div>
              <div class="ability"><b id="preview-ability">星光衝刺</b><span>造成 70 點星力傷害</span></div>
              <p class="original-note">原創學習卡，僅供課堂創作。</p>
              <div class="card-stats"><span>弱點 <b id="preview-weakness">格鬥 ×2</b></span><span>抵抗力 <b id="preview-resistance">—</b></span><span>撤退 <b id="preview-retreat">★</b></span></div>
            </article>
            <div class="exports"><button id="download-png" class="ghost">下載 PNG</button><button id="download-jpg" class="ghost">下載 JPEG</button><button onclick="window.print()" class="ghost">列印</button></div>
          </section>
        </div>
      </section>

      <section id="teacher-view" class="panel" hidden>
        <div class="teacher-head"><div><span class="eyebrow">TEACHER ONLY</span><h2>教師控制台</h2></div><button id="teacher-close" class="ghost">關閉</button></div>
        <div class="teacher-auth"><input id="teacher-code" type="password" placeholder="教師控制碼" /><button id="load-students">查看學生</button><button id="make-codes" class="secondary">產生 10 個學生代碼</button></div>
        <p class="hint">學生代碼只會在產生時完整顯示一次，請立即記錄。</p>
        <pre id="new-codes" hidden></pre>
        <div id="teacher-message" class="message"></div>
        <div id="student-list"></div>
      </section>
    </main>
    <canvas id="export-canvas" width="1047" height="1502" hidden></canvas>
    <script src="./api-config.js"></script>
    <script src="./app.js?v=20260726d"></script>
  </body>
</html>
